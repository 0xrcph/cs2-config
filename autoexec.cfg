// ============================================================
//  cs2-config / autoexec.cfg   by 0xrcph
//  Everyday settings. Safe for matchmaking: no cheats, no binds
//  that automate anything.
//
//  Install: copy to
//    <Steam>\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
//  Then add this to CS2 launch options in Steam:  +exec autoexec
//
//  Anything marked "optional" is commented out. Remove the // to use it.
//  Commands can change with game updates; if one errors in the
//  console (~), delete that line.
// ============================================================

echo "[cs2-config] loading autoexec..."

// ---------- Radar ----------
cl_radar_always_centered 0
cl_radar_scale 0.4
cl_hud_radar_scale 1.1

// ---------- Viewmodel ----------
// Optional: tweak to taste. Presets: viewmodel_presetpos 1 (desktop), 2 (couch), 3 (classic)
// viewmodel_fov 68
// viewmodel_offset_x 2.5
// viewmodel_offset_y 0
// viewmodel_offset_z -1.5
// cl_bob_lower_amt 5

// ---------- Quality of life ----------
cl_use_opens_buy_menu 0         // E no longer opens the buy menu
cl_autowepswitch 0              // don't auto-switch when picking up a weapon
snd_mute_losefocus 0            // keep game audio when you alt-tab

// ---------- Optional: show FPS ----------
// cl_showfps 1

echo "[cs2-config] done."
