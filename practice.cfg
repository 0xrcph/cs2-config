// ============================================================
//  cs2-config / practice.cfg   by 0xrcph
//  OFFLINE practice only. Turns on sv_cheats, which does NOT work
//  (and must not be used) on official matchmaking servers.
//
//  Install: same folder as autoexec.cfg.
//  Use: start a local match (Play > Practice with Bots, or a workshop
//  map), open the console (~) and type:   exec practice
// ============================================================

echo "[cs2-config] loading practice..."

// ---------- Rules ----------
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_buytime 9999
mp_buy_anywhere 1
mp_startmoney 60000
mp_maxmoney 60000
mp_autoteambalance 0
mp_limitteams 0

// ---------- Grenades ----------
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_grenade_trajectory_prac_pipreview 1
sv_grenade_trajectory_prac_trailtime 5
sv_showimpacts 1

// ---------- Bots ----------
bot_stop 1                      // bots stand still. Use bot_stop 0 to let them move
bot_kick

// ---------- Handy aliases (type the name in the console) ----------
alias rr "mp_restartgame 1"
alias bots "bot_kick; bot_add_t; bot_add_ct"
alias freeze "bot_stop 1"
alias unfreeze "bot_stop 0"

// ---------- Practice-only binds ----------
bind "n" "noclip"                          // fly through the map
bind "k" "sv_rethrow_last_grenade"         // throw your last grenade again
bind "l" "impulse 101"                     // refill cash, health and ammo
bind "o" "exec practice"                   // reload this file

mp_restartgame 1
echo "[cs2-config] practice mode on. n=noclip  k=rethrow nade  l=refill  o=reload"
